<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <title>404 — Page Not Found | Mujtaba Abdul Mannan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 24px;
        }

        h1 {
            font-size: clamp(80px, 15vw, 180px);
            margin: 0;
            line-height: 0.9;
        }

        p {
            opacity: 0.7;
            margin: 24px 0;
        }

        a {
            display: inline-block;
            padding: 14px 24px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 999px;
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main>
        <h1>404</h1>

        <p>
            The page you're looking for doesn't exist.
        </p>

        <a href="/">
            Return Home
        </a>
    </main>

</body>
</html>
